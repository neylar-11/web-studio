name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 15 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/preguntas?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"